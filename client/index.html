<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Highlight Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <span class="brand-icon">
                    <!-- Phosphor: Highlighter -->
                    <svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor"><path d="M227.31,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152a16,16,0,0,0-4.69,11.31V208a16,16,0,0,0,16,16H92.69A16,16,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM51.31,160,136,75.31,180.69,120,96,204.69ZM48,208V179.31L76.69,208Zm48-3.31L76.69,185.37,160,102.06h0l19.32,19.31Z"/></svg>
                </span>
                <span class="brand-title">Highlight Studio</span>
            </div>
            <span class="badge">PRO</span>
        </header>

        <!-- Presets -->
        <div class="section-label">Presets</div>
        <div class="presets-row">
            <button type="button" class="preset-btn active" data-preset="marker">
                <!-- Phosphor: PenNib -->
                <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M224,48a8,8,0,0,0-8-8,56.06,56.06,0,0,0-56,56,8,8,0,0,0,16,0,40,40,0,0,1,40-40A8,8,0,0,0,224,48ZM92.69,120H48a16,16,0,0,0-16,16v40a16,16,0,0,0,4.69,11.31l32,32A16,16,0,0,0,79.94,224H120a16,16,0,0,0,16-16V163.31A16,16,0,0,0,131.31,152ZM120,208H80L48,176V136H92.69L120,163.31Z"/></svg>
                Marker
            </button>
            <button type="button" class="preset-btn" data-preset="clean">
                <!-- Phosphor: SquareSplitHorizontal -->
                <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM48,48h72V208H48Zm160,160H136V48h72V208Z"/></svg>
                Clean
            </button>
            <button type="button" class="preset-btn" data-preset="caption">
                <!-- Phosphor: TextT -->
                <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M208,56a8,8,0,0,1-8,8H136V200a8,8,0,0,1-16,0V64H56a8,8,0,0,1,0-16H200A8,8,0,0,1,208,56Z"/></svg>
                Caption
            </button>
        </div>

        <!-- Color Target Scope -->
        <div class="scope-row">
            <div class="segmented-control" id="color-scope">
                <button type="button" class="scope-btn active" id="btn-scope-all" data-scope="all" title="Apply color to all lines (Master)">
                    <!-- Phosphor: Rows (Zero Radius) -->
                    <svg viewBox="0 0 256 256" width="12" height="12" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"><rect x="40" y="48" width="176" height="56"/><rect x="40" y="152" width="176" height="56"/></svg>
                    All Lines
                </button>
                <button type="button" class="scope-btn" id="btn-scope-line" data-scope="line" title="Apply color to selected line only">
                    <!-- Phosphor: LineSegment -->
                    <svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor"><path d="M213.66,42.34a8,8,0,0,0-11.32,0l-160,160a8,8,0,0,0,11.32,11.32l160-160A8,8,0,0,0,213.66,42.34Z"/></svg>
                    Selected Line
                </button>
            </div>
        </div>

        <!-- Color & Direction Row -->
        <div class="ctrl-row">
            <div class="ctrl-field color-field">
                <label for="color-picker">
                    <!-- Phosphor: Palette -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M200.77,53.89A103.27,103.27,0,0,0,128,24h-1.07A104,104,0,0,0,24,128c0,43,26.58,79.06,69.36,94.17A32,32,0,0,0,136,192a16,16,0,0,1,16-16h46.21a31.81,31.81,0,0,0,31.2-24.88,104.43,104.43,0,0,0,2.59-24A103.28,103.28,0,0,0,200.77,53.89ZM76,168a12,12,0,1,1,12-12A12,12,0,0,1,76,168Zm0-56a12,12,0,1,1,12-12A12,12,0,0,1,76,112Zm52-40a12,12,0,1,1,12-12A12,12,0,0,1,128,72Zm52,40a12,12,0,1,1,12-12A12,12,0,0,1,180,112Z"/></svg>
                    Color
                </label>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-picker" value="#FFE600">
                    <span id="color-hex">#FFE600</span>
                </div>
            </div>
            <div class="ctrl-field dir-field">
                <label for="align-select">
                    <!-- Phosphor: TextAlignLeft -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M32,64a8,8,0,0,1,8-8H216a8,8,0,0,1,0,16H40A8,8,0,0,1,32,64Zm8,48H168a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,24H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Zm-48,40H40a8,8,0,0,0,0,16H168a8,8,0,0,0,0-16Z"/></svg>
                    Direction
                </label>
                <div class="select-wrap">
                    <select id="align-select">
                        <option value="auto" selected>Auto Detect</option>
                        <option value="ltr">Left (LTR)</option>
                        <option value="rtl">Right (RTL)</option>
                        <option value="center">Center</option>
                    </select>
                    <span class="select-arrow">
                        <!-- Phosphor: CaretDown -->
                        <svg viewBox="0 0 256 256" width="9" height="9" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                    </span>
                </div>
            </div>
        </div>

        <!-- Metrics (Pad X, Pad Y, Radius) with Stepper Arrows -->
        <div class="ctrl-row">
            <div class="ctrl-field">
                <label for="pad-x">
                    <!-- Phosphor: ArrowsHorizontal -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M237.66,133.66l-32,32a8,8,0,0,1-11.32-11.32L212.69,136H43.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L43.31,120H212.69l-18.35-18.34a8,8,0,0,1,11.32-11.32l32,32A8,8,0,0,1,237.66,133.66Z"/></svg>
                    Pad X
                </label>
                <div class="stepper-box">
                    <input type="number" id="pad-x" value="8" min="0" max="100" step="1">
                    <div class="stepper-arrows">
                        <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                        </button>
                        <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="ctrl-field">
                <label for="pad-y">
                    <!-- Phosphor: ArrowsVertical -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M167.39,196.94a8,8,0,0,1-1.73,8.72l-32,32a8,8,0,0,1-11.32,0l-32-32a8,8,0,0,1,11.32-11.32L120,212.69V43.31L101.66,61.66A8,8,0,0,1,90.34,50.34l32-32a8,8,0,0,1,11.32,0l32,32a8,8,0,0,1-11.32,11.32L136,43.31V212.69l18.34-18.35a8,8,0,0,1,8.72-1.73A8,8,0,0,1,167.39,196.94Z"/></svg>
                    Pad Y
                </label>
                <div class="stepper-box">
                    <input type="number" id="pad-y" value="2" min="0" max="100" step="1">
                    <div class="stepper-arrows">
                        <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                        </button>
                        <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="ctrl-field">
                <label for="roundness">
                    <!-- Phosphor: BoundingBox -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M208,96a16,16,0,0,0,16-16V48a16,16,0,0,0-16-16H176a16,16,0,0,0-16,16v8H96V48A16,16,0,0,0,80,32H48A16,16,0,0,0,32,48V80A16,16,0,0,0,48,96h8v64H48a16,16,0,0,0-16,16v32a16,16,0,0,0,16,16H80a16,16,0,0,0,16-16v-8h64v8a16,16,0,0,0,16,16h32a16,16,0,0,0,16-16V176a16,16,0,0,0-16-16h-8V96ZM48,80V48H80V80Zm32,128H48V176H80Zm96-48H96v-8a16,16,0,0,0-16-16H72V96h8a16,16,0,0,0,16-16V72h64v8a16,16,0,0,0,16,16h8v64h-8a16,16,0,0,0-16,16Zm32,48H176V176h32Zm0-128H176V48h32Z"/></svg>
                    Radius
                </label>
                <div class="stepper-box">
                    <input type="number" id="roundness" value="0" min="0" max="50" step="1">
                    <div class="stepper-arrows">
                        <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                        </button>
                        <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                            <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Animation Section -->
        <div class="anim-section">
            <div class="anim-toggle-row">
                <label class="switch">
                    <input type="checkbox" id="anim-check" checked>
                    <span class="track"><span class="thumb"></span></span>
                </label>
                <label for="anim-check" class="anim-label">
                    <!-- Phosphor: Play -->
                    <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65A16,16,0,0,1,64,216.13V39.87A16,16,0,0,1,88.32,26.35L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg>
                    Write-on Animation
                </label>
            </div>

            <div id="anim-controls">
                <div class="anim-sub-toggles">
                    <div class="anim-sub-row">
                        <label class="switch switch-sm">
                            <input type="checkbox" id="sequential-check" checked>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                        <label for="sequential-check" class="anim-sub-label" title="Each line starts moving immediately when the previous line ends">
                            <!-- Phosphor: SortAscending -->
                            <svg viewBox="0 0 256 256" width="10" height="10" fill="currentColor"><path d="M128,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16h72A8,8,0,0,1,128,128ZM48,72h56a8,8,0,0,0,0-16H48a8,8,0,0,0,0,16Zm88,112H48a8,8,0,0,0,0,16h88a8,8,0,0,0,0-16Zm85.66-21.66-32,32a8,8,0,0,1-11.32,0l-32-32a8,8,0,0,1,11.32-11.32L176,169.37V48a8,8,0,0,1,16,0V169.37l18.34-18.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                            Sequential
                        </label>
                    </div>
                    <div class="anim-sub-row">
                        <label class="switch switch-sm">
                            <input type="checkbox" id="outro-check">
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                        <label for="outro-check" class="anim-sub-label" title="Exit un-highlight animation after hold duration">
                            <!-- Phosphor: ArrowSquareOut -->
                            <svg viewBox="0 0 256 256" width="10" height="10" fill="currentColor"><path d="M224,104a8,8,0,0,1-16,0V59.31l-66.34,66.35a8,8,0,0,1-11.32-11.32L196.69,48H152a8,8,0,0,1,0-16h72a8,8,0,0,1,8,8Zm-32,80a8,8,0,0,0-8,8v24H48V72H72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,72V216a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V192A8,8,0,0,0,192,184Z"/></svg>
                            Outro Exit
                        </label>
                    </div>
                    <button type="button" class="order-toggle-btn disabled" id="btn-outro-order" data-order="first" title="Exit Order: First Line First (1➔N). Click to toggle: Last Line First (N➔1)">
                        <span id="order-icon-first">
                            <!-- Phosphor: SortAscending (Top to bottom) -->
                            <svg viewBox="0 0 256 256" width="10" height="10" fill="currentColor"><path d="M128,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16h72A8,8,0,0,1,128,128ZM48,72h56a8,8,0,0,0,0-16H48a8,8,0,0,0,0,16Zm88,112H48a8,8,0,0,0,0,16h88a8,8,0,0,0,0-16Zm85.66-21.66-32,32a8,8,0,0,1-11.32,0l-32-32a8,8,0,0,1,11.32-11.32L176,169.37V48a8,8,0,0,1,16,0V169.37l18.34-18.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                        </span>
                        <span id="order-icon-last" style="display:none;">
                            <!-- Phosphor: SortDescending (Bottom to top) -->
                            <svg viewBox="0 0 256 256" width="10" height="10" fill="currentColor"><path d="M128,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16h72A8,8,0,0,1,128,128ZM48,72h88a8,8,0,0,0,0-16H48a8,8,0,0,0,0,16Zm56,112H48a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Zm109.66-82.34a8,8,0,0,0-11.32,0L192,86.63V208a8,8,0,0,0,16,0V86.63l18.34,18.35a8,8,0,0,0,11.32-11.32l-32-32A8,8,0,0,0,213.66,101.66Z"/></svg>
                        </span>
                        <span id="order-label">1➔N</span>
                    </button>
                </div>

                <div class="ctrl-row">
                    <div class="ctrl-field">
                        <label for="line-dur">
                            <!-- Phosphor: Timer -->
                            <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216ZM173.66,90.34a8,8,0,0,1,0,11.32l-40,40a8,8,0,0,1-11.32-11.32l40-40A8,8,0,0,1,173.66,90.34ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z"/></svg>
                            In (s)
                        </label>
                        <div class="stepper-box">
                            <input type="number" id="line-dur" value="0.35" step="0.05" min="0.05">
                            <div class="stepper-arrows">
                                <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                                </button>
                                <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="ctrl-field disabled" id="out-time-col">
                        <label for="out-time">
                            <!-- Phosphor: HourglassSimple -->
                            <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M200,80a15.86,15.86,0,0,0-5-11.66L149.34,24H208a8,8,0,0,0,0-16H48a8,8,0,0,0,0,16h58.66L61,68.34A15.86,15.86,0,0,0,56,80v96a15.86,15.86,0,0,0,5,11.66L106.66,232H48a8,8,0,0,0,0,16H208a8,8,0,0,0,0-16H149.34L195,187.66A15.86,15.86,0,0,0,200,176ZM72,80V40H184V80l-44,44a16,16,0,0,0,0,22.63l44,44v45.37H72V190.63l44-44a16,16,0,0,0,0-22.63Z"/></svg>
                            Out (s)
                        </label>
                        <div class="stepper-box">
                            <input type="number" id="out-time" value="1.50" step="0.10" min="0.10" disabled>
                            <div class="stepper-arrows">
                                <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                                </button>
                                <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="ctrl-field" id="stagger-col">
                        <label for="stagger" id="stagger-label">
                            <!-- Phosphor: Clock -->
                            <svg viewBox="0 0 256 256" width="11" height="11" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></svg>
                            Gap (s)
                        </label>
                        <div class="stepper-box">
                            <input type="number" id="stagger" value="0.00" step="0.02" min="0">
                            <div class="stepper-arrows">
                                <button type="button" class="step-arrow step-up" tabindex="-1" title="Increase">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
                                </button>
                                <button type="button" class="step-arrow step-down" tabindex="-1" title="Decrease">
                                    <svg viewBox="0 0 256 256" width="7" height="7" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <div class="action-section">
            <button type="button" id="btn-smart-apply" class="primary-btn" title="Click: Apply / Update Highlight (Alt+Click or Right-Click: Clear)">
                <!-- Phosphor: Lightning -->
                <svg viewBox="0 0 256 256" width="13" height="13" fill="currentColor"><path d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/></svg>
                <span id="btn-label">Apply Highlight</span>
            </button>
            <div class="action-hint">Click: Apply / Update &nbsp;·&nbsp; Alt+Click: Clear</div>
        </div>

        <!-- Status -->
        <div id="status-bar" class="status-bar">
            <span class="status-dot"></span>
            <span id="status-text">Ready</span>
        </div>

        <!-- Debug Section -->
        <div class="debug-section">
            <button type="button" id="btn-debug" class="debug-toggle">
                <!-- Phosphor: Terminal -->
                <svg viewBox="0 0 256 256" width="10" height="10" fill="currentColor"><path d="M120,137,48,201A8,8,0,1,1,37.95,189L101.33,137,38,85A8,8,0,1,1,48,73l72,64A8,8,0,0,1,120,137Zm96,55H120a8,8,0,0,0,0,16h96a8,8,0,0,0,0-16Z"/></svg>
                Debug Console
            </button>
            <div id="debug-panel" class="debug-panel" style="display:none;">
                <pre id="debug-log">No logs yet.</pre>
                <div class="debug-actions">
                    <button type="button" id="btn-refresh-log" class="debug-btn">Refresh</button>
                    <button type="button" id="btn-clear-log" class="debug-btn">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/CSInterface.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
